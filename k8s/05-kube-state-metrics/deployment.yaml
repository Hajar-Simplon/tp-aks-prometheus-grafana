apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: monitoring-stack
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: monitoring-stack

    spec:
      serviceAccountName: kube-state-metrics

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1
          imagePullPolicy: IfNotPresent

          args:
            - --resources=pods,nodes,namespaces,deployments,daemonsets,statefulsets,replicasets,jobs,cronjobs,services,persistentvolumes,persistentvolumeclaims

          ports:
            - name: http-metrics
              containerPort: 8080
              protocol: TCP

            - name: telemetry
              containerPort: 8081
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /livez
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
