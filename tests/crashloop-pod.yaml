apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  namespace: monitoring
  labels:
    app.kubernetes.io/name: crashloop-demo
    app.kubernetes.io/part-of: monitoring-stack
spec:
  restartPolicy: Always

  containers:
    - name: crashloop-demo
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - echo "Intentional crash for Alertmanager test"; exit 1

      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
